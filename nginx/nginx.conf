worker_processes auto;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Límite estricto de carga (soporta PDFs de hasta 10MB + cabeceras multipart)
    client_max_body_size 15M;

    upstream django_app {
        server web:8000;
    }

    # Redirección HTTP (80) -> HTTPS (443)
    server {
        listen 80;
        server_name tesoreriadedatos.com www.tesoreriadedatos.com 184.197.136.141 _;
        return 301 https://tesoreriadedatos.com$request_uri;
    }

    # Servidor Principal HTTPS (443)
    server {
        listen 443 ssl;
        http2 on;
        server_name tesoreriadedatos.com www.tesoreriadedatos.com;

        ssl_certificate /etc/letsencrypt/live/tesoreriadedatos.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tesoreriadedatos.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Cabeceras de seguridad
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;

        # Ruteo de archivos estáticos
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, immutable";
        }

        # Proxy inverso hacia Gunicorn
        location / {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}
