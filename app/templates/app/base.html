{% load static %}
<!DOCTYPE html>
<html lang="es">

    <title>{% block title %}Tomas Cueva — Sistema Financiero{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'app/css/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner container">
            <span class="brand-name">Tomas Cueva</span>
            <nav aria-label="Acceso de usuario">
                <a href="#" class="btn-outline">Iniciar sesión</a>

        </div>

    <main class="main-ledger container">

</html>
