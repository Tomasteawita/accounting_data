{% extends "app/base.html" %}

{% block title %}Contraseña Actualizada — Tomas Cueva{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <section class="auth-card" aria-labelledby="reset-complete-title">
        <header class="auth-header">
            <h1 id="reset-complete-title" class="auth-title">Contraseña Restablecida</h1>
            <p class="auth-subtitle">Operación completada.</p>
        </header>

        <div class="alert-stoic" role="status">
            Su contraseña ha sido actualizada correctamente. Ya puede iniciar sesión con sus nuevas credenciales.
        </div>

        <div class="auth-actions">
            <a href="{% url 'app:login' %}" class="btn-primary">Iniciar Sesión</a>
        </div>
    </section>
</div>
{% endblock %}
